        body { background-color: var(--secondary); color: var(--text); line-height: 1.6; }
        
        header {
            background: linear-gradient(135deg, var(--primary), #1a3823);
            color: white; padding: 2.5rem 1rem; text-align: center; position: relative;
        }
        header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        
        .admin-btn, .add-btn {
            background: rgba(255, 255, 255, 0.2); border: 1px solid white; color: white;
            padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-weight: 600;
            position: absolute; top: 20px;
        }
        .admin-btn { right: 20px; }
        .add-btn { right: 150px; display: none; }
        .admin-btn:hover, .add-btn:hover { background: white; color: var(--primary); }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        
        .search-box { display: flex; justify-content: center; margin-bottom: 1.5rem; }
        .search-box input {
            width: 100%; max-width: 500px; padding: 0.8rem 1.2rem; font-size: 1rem;
            border: 2px solid #ddd; border-radius: 30px; outline: none;
        }

        .categories {
            display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap;
        }
        .cat-btn {
            background: #e2e8f0; border: none; padding: 0.5rem 1.2rem; border-radius: 20px;
            cursor: pointer; font-weight: 600; color: #4a5568; transition: all 0.3s;
        }
        .cat-btn.active, .cat-btn:hover { background: var(--primary); color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .product-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        
        .product-image-container { width: 100%; height: 220px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 1rem; border-bottom: 1px solid #eee; }
        .product-image-container img { max-height: 100%; max-width: 100%; object-fit: contain; }
        
        .product-header { background-color: var(--primary); color: white; padding: 1rem 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 0.7rem; background: rgba(255,255,255,0.2); padding: 0.2rem 0.5rem; border-radius: 10px; }
        
        .product-body { padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; flex-grow: 1; }
        .section-title { font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; }
        .product-body p { font-size: 0.9rem; color: #555; }
        
        .admin-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
        .btn-edit { background: var(--edit); color: white; border: none; padding: 0.4rem; border-radius: 4px; cursor: pointer; flex: 1; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 0.4rem; border-radius: 4px; cursor: pointer; flex: 1; }
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 2rem; border-radius: 12px; width: 100%; max-width: 450px; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { color: var(--primary); margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.3rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 6px; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 0.8rem; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #888; }

            if(!p) return;
            document.getElementById('modalTitle').innerText = "Edit Product";
            document.getElementById('editId').value = p.id;
            document.getElementById('manageTitle').value = p.name;
            document.getElementById('manageCat').value = p.category;

            document.getElementById('manageBenefits').value = p.benefits;
            document.getElementById('manageImage').value = p.img || "";
            document.getElementById('adminDashboard').style.display = 'flex';
        }

        function saveProduct() {
            let id = document.getElementById('editId').value;
            let name = document.getElementById('manageTitle').value;
            let cat = document.getElementById('manageCat').value;
            let uses = document.getElementById('manageUses').value;
            let benefits = document.getElementById('manageBenefits').value;
            let image = document.getElementById('manageImage').value;

            if (!name || !uses || !benefits) { alert("Fill all fields!"); return; }

            let productData = {
                name: name,
                category: cat,
                uses: uses,
                benefits: benefits,
                img: image || ""
            };

            // Agar fallback item hai (jiska id number hai), toh use cloud par naya add karenge
            if(id && isNaN(id)) {
                db.collection("doterra_products").doc(id).update(productData);
            } else {
                db.collection("doterra_products").add(productData);
            }
            closeModals();
        }

            if(!isNaN(id)) {

        function filterProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('product-card');
            for (let i = 0; i < cards.length; i++) {
                let cardText = cards[i].innerText.toLowerCase();
                cards[i].style.display = cardText.includes(input) ? "flex" : "none";
            }
        }

        function filterCat(category, btn) {
            let buttons = document.getElementsByClassName('cat-btn');
            for (let b of buttons) { b.classList.remove('active'); }
            btn.classList.add('active');

            let cards = document.getElementsByClassName('product-card');
            for (let card of cards) {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }
        }
    </script>
</body>
</html>

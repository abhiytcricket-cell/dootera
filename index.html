            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            position: absolute;

            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 30px;
            outline: none;
            transition: border-color 0.3s;

            border-color: var(--primary);
        }

            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;

            font-size: 0.9rem;

            font-weight: 600;

            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }

        .products-grid {

        .product-card {

            overflow: hidden;

            flex-direction: column;

            let id = document.getElementById('editId').value;
            let name = document.getElementById('manageTitle').value;
            let cat = document.getElementById('manageCat').value;
            let uses = document.getElementById('manageUses').value;
            let benefits = document.getElementById('manageBenefits').value;
            let image = document.getElementById('manageImage').value;

            if (!name || !uses || !benefits) {
                alert("Please fill out Name, Uses, and Benefits!");
                return;
            }

            if(id) {
                let index = productsData.findIndex(p => p.id == id);
                if(index !== -1) {
                    productsData[index].n = name;
                    productsData[index].c = cat;
                    productsData[index].u = uses;
                    productsData[index].b = benefits;
                    productsData[index].img = image;
                }
            } else {
                let newObj = {
                    id: Date.now(),
                    n: name,
                    c: cat,
                    u: uses,
                    b: benefits,
                    img: image || null
                };
                productsData.unshift(newObj);
            }

            localStorage.setItem('doterra_india_75_products', JSON.stringify(productsData));
            closeModals();
            renderProducts();
        }

        function deleteProduct(id) {
            if (confirm("Are you sure you want to delete this product?")) {
                productsData = productsData.filter(p => p.id !== id);
                localStorage.setItem('doterra_india_75_products', JSON.stringify(productsData));
                renderProducts();
            }
        }

        function closeModals() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'none';
        }

        function filterProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('product-card');

            for (let i = 0; i < cards.length; i++) {
                let cardText = cards[i].innerText.toLowerCase();
                if (cardText.includes(input)) {
                    cards[i].style.display = "flex";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }

        function filterCat(category, btn) {
            let buttons = document.getElementsByClassName('cat-btn');
            for (let b of buttons) { b.classList.remove('active'); }
            btn.classList.add('active');

            let cards = document.getElementsByClassName('product-card');
            for (let card of cards) {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }
        }

        renderProducts();
    </script>
</body>
</html>
